services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epd
      POSTGRES_PASSWORD: epd
      POSTGRES_DB: epd
    volumes:
      - epd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epd"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://epd:epd@db:5432/epd
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  epd_pgdata:
